[workspace]
members = ["contracts/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/Phoenix-Protocol-Group/phoenix-nft-marketplace"

[workspace.dependencies]
soroban-sdk = "25.3.1"
soroban-token-sdk = "25.3.1"
test-case = "3.3"
helpers = { path = "./helpers" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
